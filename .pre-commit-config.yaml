# A light version of CI. `prek install` writes the shims into the clone's
# shared hooks directory, so they cover every worktree.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: bun run --bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, tsx, javascript, jsx, json, css]
        stages: [pre-commit]
      - id: typecheck
        name: typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: test
        name: bun test
        entry: bun run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
