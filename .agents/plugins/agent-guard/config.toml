# Opts project-flow into the agent-guard rules layer and the fallow changeset audit.
# Stop and SubagentStop refuse to finish while the audit has findings.
block = true

[python]
lizard = true
lizard_extensions = '\.(ts|tsx|mjs)$'
lizard_baseline = ".agents/plugins/agent-guard/whitelizard.txt"
# agent-guard has no switch that turns a lizard check off, so a limit no function reaches turns off the complexity and argument checks.
lizard_ccn = 10000
lizard_length = 200
lizard_arguments = 10000
# fallow covers TypeScript and JavaScript duplication, so jscpd reads only Python.
jscpd = true
jscpd_extensions = '\.py$'

[file_length]
enabled = true

[[file_length.limits]]
extensions = '\.(ts|tsx|mjs)$'
warn_lines = 500
block_lines = 1000

# Each file on main that is already past the block limit. The check fails
# only when that file grows past the recorded size.
[[file_length.limits]]
pattern = "src/app.ts"
accept = true
lines = 1840

[[file_length.limits]]
pattern = "src/cards.tsx"
accept = true
lines = 1093

[[file_length.limits]]
pattern = "src/domain.ts"
accept = true
lines = 4489

