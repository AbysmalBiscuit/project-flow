# Opts project-flow into the agent-guard rules layer and the fallow changeset audit.
# Stop and SubagentStop refuse to finish while the audit has findings.
block = true

[python]
lizard = true
lizard_extensions = '\.(ts|tsx|mjs)$'
lizard_baseline = ".agents/plugins/agent-guard/whitelizard.txt"
# agent-guard has no switch that turns a lizard check off, so a limit no function reaches turns off the complexity and argument checks.
lizard_ccn = 10000
lizard_length = 200
lizard_arguments = 10000
jscpd = false
