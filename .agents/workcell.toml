[merge]
method = "squash"

[workflow.standard]
merge_auto = "yes"
merge_rebase = "never"

[roles.manager]
prefer = [{ harness = "claude", model = "opus", effort = "low" }]

[roles.implementer]
prefer = [{ harness = "claude", model = "opus", effort = "medium" }]

[roles.code-reviewer]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]

[roles.pr-reviewer]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]

[roles.verifier]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]

[roles.receiver]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]

[roles.probe]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]

[roles.conceptual-reviewer]
prefer = [{ harness = "codex", model = "gpt-6.1-sol", effort = "medium" }]
