#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
baseline_ref = "origin/main"
worktree_root = "../project-flow_workspaces"
pr_create_state = "ready"

[tracker]
kind = "github"

[people.lev]
github = "AbysmalBiscuit"

[ticket.fields.github.assignees]
type = "user"
list = true
where = "assignees"
level = "info"

[ticket.fields.github.blocked_by]
type = "issue"
list = true
where = "blocked_by"
level = "info"

[ticket.fields.github.labels]
type = "enum"
list = true
where = "labels"
values = [
	{ name = "accessibility", id = "accessibility" },
	{ name = "bug", id = "bug" },
	{ name = "documentation", id = "documentation" },
	{ name = "duplicate", id = "duplicate" },
	{ name = "enhancement", id = "enhancement" },
	{ name = "good first issue", id = "good first issue" },
	{ name = "help wanted", id = "help wanted" },
	{ name = "invalid", id = "invalid" },
	{ name = "question", id = "question" },
	{ name = "wontfix", id = "wontfix" },
	{ name = "needs-triage", id = "needs-triage" },
	{ name = "needs-info", id = "needs-info" },
	{ name = "ready-for-human", id = "ready-for-human" },
	{ name = "ready-for-agent", id = "ready-for-agent" },
]
level = "info"

[ticket.fields.github.parent]
type = "issue"
where = "parent"
level = "info"

[hooks]
after_worktree_create = [["bun", "install", "--frozen-lockfile"]]

[ticket.sync]

[[ticket.sync.rules]]
assignee = "me"

[ticket.sync.statuses]
"" = "pending"

[tasks.typecheck]
description = "Type check with bun check"
run = ["bun", "run", "typecheck"]

[tasks.test]
description = "Run the HTTP-seam tests"
run = ["sh", "scripts/test-slot.sh"]

[tasks.lint]
description = "Lint and format check with biome"
run = ["bun", "run", "lint"]

[tasks.check]
description = "Type check, test, and lint with format check"
steps = [{ task = "typecheck" }, { task = "test" }, { task = "lint" }]

[apps.project-flow]
base_port = 47100
path = "."
launch = ["bun", "src/main.ts", "--port", "{{ port }}"]
url = "http://127.0.0.1:{{ port }}"

[tasks.install]
description = "Install the dependencies from the lockfile"
run = ["bun", "install", "--frozen-lockfile"]

[tasks.start]
description = "Install the dependencies, then serve the app"
steps = [{ task = "install" }, { up = "project-flow" }]
